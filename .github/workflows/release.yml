name: Release

# 推送 v 开头的 tag（比如 v0.1.0）时，分别在 macOS 和 Windows 上打包，
# 产物挂到同名的 GitHub Release 上。Release 先建成草稿，确认无误后再手动发布。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 通用包：一个 .dmg 同时支持 Intel 和 Apple Silicon
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: ''
            rust-targets: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 和 .nvmrc、CI 保持一致
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # tauri.conf.json 的 beforeBuildCommand 会先跑 npm run build:tauri
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Resume Studio ${{ github.ref_name }}
          releaseBody: |
            macOS：下载 .dmg。首次打开被拦时，到"系统设置 → 隐私与安全性"点"仍要打开"；macOS 15 起右键"打开"不再生效。也可以在终端执行 `xattr -dr com.apple.quarantine "/Applications/Resume Studio.app"`。
            Windows：下载 .exe 或 .msi。SmartScreen 提示时点"更多信息"，再点"仍要运行"。
          releaseDraft: true
          args: ${{ matrix.args }}
