[package]
name = "resume-studio"
version = "0.1.0"
description = "Local-first resume editor with A4 PDF/DOCX export"
authors = ["Awen-9"]
license = "MIT"
repository = "https://github.com/Awen-9/resume-studio"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "resume_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
